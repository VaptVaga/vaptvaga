</div>
</div>

<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>

</div>
</div>
<div class="flex justify-end pt-1">

</div>
<button class="w-full h-14 primary-gradient text-white font-headline font-bold rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all" type="submit">
