<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#6cf8bb",
              "primary": "#004ac6",
              "on-secondary-fixed-variant": "#005236",
              "on-secondary": "#ffffff",
              "secondary": "#006c49",
              "inverse-primary": "#b4c5ff",
              "surface-tint": "#0053db",
              "on-surface-variant": "#434655",
              "error": "#ba1a1a",
              "surface-container-highest": "#d8e3fb",
              "on-tertiary-container": "#ffede6",
              "on-tertiary-fixed-variant": "#7d2d00",
              "secondary-fixed": "#6ffbbe",
              "surface": "#f9f9ff",
              "tertiary-fixed-dim": "#ffb596",
              "inverse-surface": "#263143",
              "primary-container": "#2563eb",
              "on-tertiary-fixed": "#360f00",
              "on-primary-container": "#eeefff",
              "on-primary-fixed": "#00174b",
              "tertiary-container": "#bc4800",
              "on-error-container": "#93000a",
              "background": "#f9f9ff",
              "on-primary-fixed-variant": "#003ea8",
              "on-secondary-fixed": "#002113",
              "outline": "#737686",
              "surface-container-high": "#dee8ff",
              "error-container": "#ffdad6",
              "tertiary": "#943700",
              "surface-container": "#e7eeff",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#dbe1ff",
              "on-surface": "#111c2d",
              "surface-variant": "#d8e3fb",
              "surface-bright": "#f9f9ff",
              "surface-dim": "#cfdaf2",
              "on-primary": "#ffffff",
              "on-background": "#111c2d",
              "tertiary-fixed": "#ffdbcd",
              "secondary-fixed-dim": "#4edea3",
              "on-tertiary": "#ffffff",
              "primary-fixed-dim": "#b4c5ff",
              "outline-variant": "#c3c6d7",
              "inverse-on-surface": "#ecf1ff",
              "surface-container-low": "#f0f3ff",
              "on-secondary-container": "#00714d",
              "on-error": "#ffffff"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tap-highlight-none { -webkit-tap-highlight-color: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased pb-32">
<!-- Top Navigation Anchor -->
<header class="bg-surface/80 backdrop-blur-xl fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-on-surface-variant tap-highlight-none active:scale-95 duration-200" data-icon="arrow_back">arrow_back</button>
<span class="font-plus-jakarta text-headline-md font-bold tracking-tight text-on-surface">Publicar Vaga</span>
</div>
<div class="flex items-center gap-2">
<span class="text-label-md font-bold text-primary bg-primary/10 px-3 py-1 rounded-full">Passo 2 de 3</span>
</div>
</header>
<main class="mt-20 px-6 max-w-md mx-auto">
<!-- Progress Indicator Visual -->
<div class="flex gap-2 mb-8">
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-high"></div>
</div>
<!-- Section Title -->
<div class="mb-8">
<h1 class="font-headline text-headline-md font-bold text-on-surface leading-tight">Logística e Ganhos</h1>
<p class="text-on-surface-variant mt-2">Defina o cronograma e a compensação financeira para esta oportunidade.</p>
</div>
<!-- Form Canvas -->
<div class="space-y-8">
<!-- Date & Time Card -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-[0px_8px_24px_rgba(17,28,45,0.02)]">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-primary bg-primary/5 p-2 rounded-lg" data-icon="calendar_today">calendar_today</span>
<h2 class="font-headline font-bold text-lg">Cronograma</h2>
</div>
<div class="grid grid-cols-1 gap-4">
<div class="space-y-2">
<label class="text-label-md font-bold uppercase tracking-wider text-on-surface-variant">Data de Início</label>
<div class="relative group">
<input class="w-full h-14 bg-surface-container-low border-none rounded-lg px-4 font-medium focus:ring-2 focus:ring-primary/20 transition-all outline-none" type="date" value="2023-11-20"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-label-md font-bold uppercase tracking-wider text-on-surface-variant">Hora Entrada</label>
<input class="w-full h-14 bg-surface-container-low border-none rounded-lg px-4 font-medium focus:ring-2 focus:ring-primary/20 transition-all outline-none" type="time" value="08:00"/>
</div>
<div class="space-y-2">
<label class="text-label-md font-bold uppercase tracking-wider text-on-surface-variant">Hora Saída</label>
<input class="w-full h-14 bg-surface-container-low border-none rounded-lg px-4 font-medium focus:ring-2 focus:ring-primary/20 transition-all outline-none" type="time" value="17:00"/>
</div>
</div>
</div>
</section>
<!-- Remuneration Card -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-[0px_8px_24px_rgba(17,28,45,0.02)]">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-primary bg-primary/5 p-2 rounded-lg" data-icon="payments">payments</span>
<h2 class="font-headline font-bold text-lg">Remuneração</h2>
</div>
<div class="space-y-4">
<div class="space-y-2">
<label class="text-label-md font-bold uppercase tracking-wider text-on-surface-variant">Valor por Dia (R$)</label>
<div class="relative flex items-center">
<span class="absolute left-4 font-bold text-on-surface-variant">R$</span>
<input class="w-full h-14 bg-surface-container-low border-none rounded-lg pl-12 pr-4 font-bold text-xl text-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="0,00" type="number"/>
</div>
</div>
<div class="flex items-center gap-3 p-4 bg-surface-container-low rounded-lg">
<input class="w-6 h-6 rounded border-outline-variant text-primary focus:ring-primary" id="negociavel" type="checkbox"/>
<label class="text-body-lg font-medium text-on-surface" for="negociavel">Valor negociável</label>
</div>
</div>
</section>
<!-- Benefits Checklist -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-[0px_8px_24px_rgba(17,28,45,0.02)]">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-primary bg-primary/5 p-2 rounded-lg" data-icon="redeem">redeem</span>
<h2 class="font-headline font-bold text-lg">Benefícios</h2>
</div>
<div class="grid grid-cols-1 gap-3">
<label class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg cursor-pointer active:scale-95 transition-transform">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="directions_bus">directions_bus</span>
<span class="font-medium">Vale Transporte</span>
</div>
<input checked="" class="w-6 h-6 rounded-full border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg cursor-pointer active:scale-95 transition-transform">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="restaurant">restaurant</span>
<span class="font-medium">Vale Refeição</span>
</div>
<input checked="" class="w-6 h-6 rounded-full border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg cursor-pointer active:scale-95 transition-transform">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="medical_services">medical_services</span>
<span class="font-medium">Seguro de Vida</span>
</div>
<input class="w-6 h-6 rounded-full border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg cursor-pointer active:scale-95 transition-transform">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="add_circle">add_circle</span>
<span class="font-medium">Outros</span>
</div>
<input class="w-6 h-6 rounded-full border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
</label>
</div>
</section>
</div>
<!-- Footer Action -->
<div class="mt-12 flex flex-col gap-4">
<button class="w-full h-16 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg rounded-full shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-95 transition-all">
                Próximo Passo
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full h-14 bg-surface-container-highest text-on-surface font-bold rounded-full active:scale-95 transition-all">
                Salvar Rascunho
            </button>
</div>
</main>
<!-- Bottom Navigation Shell - Hidden for this focused task as per mandate -->
<nav class="hidden fixed bottom-0 w-full z-50 rounded-t-[3rem] border-t border-outline-variant/10 bg-white/80 backdrop-blur-2xl shadow-[0px_-8px_24px_rgba(17,28,45,0.04)] flex justify-around items-center h-24 px-4 pb-4">
<div class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:opacity-80 transition-opacity active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-inter text-label-md font-bold uppercase tracking-wider">Início</span>
</div>
<div class="flex flex-col items-center justify-center text-primary bg-primary/10 rounded-full px-4 py-2 hover:opacity-80 transition-opacity active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="work">work</span>
<span class="font-inter text-label-md font-bold uppercase tracking-wider">Vagas</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:opacity-80 transition-opacity active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="chat_bubble">chat_bubble</span>
<span class="font-inter text-label-md font-bold uppercase tracking-wider">Mensagens</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:opacity-80 transition-opacity active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-inter text-label-md font-bold uppercase tracking-wider">Perfil</span>
</div>
</nav>
</body></html>
