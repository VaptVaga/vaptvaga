<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VaptVaga - Onboarding Empresa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:ital,wght@0,700;0,800;1,700;1,800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#6cf8bb",
              "primary": "#004ac6",
              "on-secondary-fixed-variant": "#005236",
              "on-secondary": "#ffffff",
              "secondary": "#006c49",
              "inverse-primary": "#b4c5ff",
              "surface-tint": "#0053db",
              "on-surface-variant": "#434655",
              "error": "#ba1a1a",
              "surface-container-highest": "#d8e3fb",
              "on-tertiary-container": "#ffede6",
              "on-tertiary-fixed-variant": "#7d2d00",
              "secondary-fixed": "#6ffbbe",
              "surface": "#f9f9ff",
              "tertiary-fixed-dim": "#ffb596",
              "inverse-surface": "#263143",
              "primary-container": "#2563eb",
              "on-tertiary-fixed": "#360f00",
              "on-primary-container": "#eeefff",
              "on-primary-fixed": "#00174b",
              "tertiary-container": "#bc4800",
              "on-error-container": "#93000a",
              "background": "#f9f9ff",
              "on-primary-fixed-variant": "#003ea8",
              "on-secondary-fixed": "#002113",
              "outline": "#737686",
              "surface-container-high": "#dee8ff",
              "error-container": "#ffdad6",
              "tertiary": "#943700",
              "surface-container": "#e7eeff",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#dbe1ff",
              "on-surface": "#111c2d",
              "surface-variant": "#d8e3fb",
              "surface-bright": "#f9f9ff",
              "surface-dim": "#cfdaf2",
              "on-primary": "#ffffff",
              "on-background": "#111c2d",
              "tertiary-fixed": "#ffdbcd",
              "secondary-fixed-dim": "#4edea3",
              "on-tertiary": "#ffffff",
              "primary-fixed-dim": "#b4c5ff",
              "outline-variant": "#c3c6d7",
              "inverse-on-surface": "#ecf1ff",
              "surface-container-low": "#f0f3ff",
              "on-secondary-container": "#00714d",
              "on-error": "#ffffff"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .tap-highlight-none { -webkit-tap-highlight-color: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- Top Navigation Anchor (Shared Component Mapping) -->
<header class="bg-surface/80 backdrop-blur-xl fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-on-surface-variant tap-highlight-none active:scale-95 duration-200">arrow_back</button>
<span class="text-2xl font-black text-primary italic font-headline">VaptVaga</span>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant">help_outline</span>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-md mx-auto">
<!-- Progress Header -->
<div class="mb-10">
<div class="flex justify-between items-end mb-4">
<div>
<span class="text-label-md font-bold uppercase tracking-wider text-primary mb-1 block">Passo 1 de 4</span>
<h1 class="text-headline-md font-bold tracking-tight font-headline text-on-surface">Identificação</h1>
</div>
<div class="relative w-12 h-12 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90">
<circle class="text-surface-container-high" cx="24" cy="24" fill="transparent" r="20" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-primary" cx="24" cy="24" fill="transparent" r="20" stroke="currentColor" stroke-dasharray="125.6" stroke-dashoffset="94.2" stroke-width="4"></circle>
</svg>
<span class="absolute text-[10px] font-bold">25%</span>
</div>
</div>
<p class="text-on-surface-variant leading-relaxed">Conte-nos um pouco sobre a sua empresa para começarmos a configurar seu perfil profissional.</p>
</div>
<!-- Onboarding Form -->
<form class="space-y-8">
<!-- Logo Upload Bento-style card -->
<div class="bg-surface-container-lowest rounded-xl p-8 flex flex-col items-center justify-center border-2 border-dashed border-outline-variant/30 hover:border-primary/40 transition-colors group">
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center mb-4 group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="add_a_photo">add_a_photo</span>
</div>
<span class="font-bold text-on-surface">Logo da Empresa</span>
<span class="text-label-md text-on-surface-variant mt-1">Toque para fazer upload</span>
</div>
<div class="space-y-6">
<!-- Nome Fantasia -->
<div class="space-y-2">
<label class="text-label-md font-bold text-on-surface-variant ml-2">NOME FANTASIA</label>
<input class="w-full h-16 px-6 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline/60 text-lg font-medium" placeholder="Ex: VaptVaga Tech" type="text"/>
</div>
<!-- CNPJ -->
<div class="space-y-2">
<label class="text-label-md font-bold text-on-surface-variant ml-2">CNPJ</label>
<input class="w-full h-16 px-6 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline/60 text-lg font-medium" placeholder="00.000.000/0000-00" type="text"/>
</div>
<!-- Segmento Asymmetric Layout (Two columns) -->
<div class="space-y-2">
<label class="text-label-md font-bold text-on-surface-variant ml-2">SEGMENTO</label>
<div class="relative">
<select class="w-full h-16 px-6 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-lg font-medium appearance-none">
<option disabled="" selected="" value="">Selecione um segmento</option>
<option>Tecnologia</option>
<option>Varejo</option>
<option>Saúde</option>
<option>Educação</option>
</select>
<span class="material-symbols-outlined absolute right-6 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<div class="grid grid-cols-12 gap-4">
<!-- Cidade -->
<div class="col-span-8 space-y-2">
<label class="text-label-md font-bold text-on-surface-variant ml-2">CIDADE</label>
<input class="w-full h-16 px-6 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline/60 text-lg font-medium" placeholder="Cidade" type="text"/>
</div>
<!-- Estado -->
<div class="col-span-4 space-y-2">
<label class="text-label-md font-bold text-on-surface-variant ml-2">ESTADO</label>
<div class="relative">
<select class="w-full h-16 px-4 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-lg font-medium appearance-none">
<option>SP</option>
<option>RJ</option>
<option>MG</option>
<option>RS</option>
<option>PR</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-outline text-sm">expand_more</span>
</div>
</div>
</div>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<footer class="fixed bottom-0 w-full bg-white/80 backdrop-blur-2xl z-50 rounded-t-[3rem] shadow-[0px_-8px_24px_rgba(17,28,45,0.04)] px-6 pb-8 pt-6">
<div class="max-w-md mx-auto">
<button class="w-full h-16 bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-lg rounded-full shadow-lg shadow-primary/20 active:scale-95 transition-transform duration-150 flex items-center justify-center gap-2">
                Continuar
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-label-md text-on-surface-variant mt-4 font-medium">Você poderá editar essas informações depois.</p>
</div>
</footer>
<!-- Visual Polish: Background Gradients -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -right-[10%] w-[60%] h-[40%] bg-primary/5 blur-[100px] rounded-full"></div>
<div class="absolute bottom-[10%] -left-[10%] w-[50%] h-[30%] bg-secondary-container/10 blur-[80px] rounded-full"></div>
</div>
</body></html>
