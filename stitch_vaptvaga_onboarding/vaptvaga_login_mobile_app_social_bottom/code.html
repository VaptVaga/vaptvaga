<style>

        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface-container-lowest font-body text-on-surface antialiased">
<div class="scroll-container flex flex-col min-h-screen">
<!-- Native-feel Header -->
<header class="sticky top-0 z-10 bg-surface-container-lowest/80 backdrop-blur-md px-4 py-4 flex items-center justify-between">
<button aria-label="Voltar" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back_ios_new</span>
</button>
<div class="flex items-center gap-2">
<div class="w-7 h-7 primary-gradient rounded-lg flex items-center justify-center text-white">
<svg class="w-4 h-4" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" fill="currentColor"></path>
</svg>
</div>
<span class="font-headline font-extrabold text-lg tracking-tight">VaptVaga</span>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow px-6 pt-4 pb-12">
<!-- Welcome Text -->
<div class="mb-6">
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface mb-2">Bem-vindo de volta</h1>
<p class="text-on-surface-variant text-sm font-medium leading-relaxed">Entre na sua conta para gerenciar suas vagas ou freelas.</p>
</div>
<!-- Social Logins -->
<!-- Divider -->
<!-- Form -->
<form class="space-y-5">
<div class="space-y-2">
<label class="font-headline text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">E-mail</label>
<input class="w-full h-14 px-5 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all placeholder:text-outline/60 text-on-surface" placeholder="nome@exemplo.com" type="email"/>
</div>
<div class="space-y-2">
<label class="font-headline text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Senha</label>
<div class="relative">
<input class="w-full h-14 px-5 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all placeholder:text-outline/60 text-on-surface" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end">
<a class="text-xs font-bold text-primary hover:underline py-2" href="#">Esqueceu sua senha?</a>
</div>
<button class="w-full h-14 primary-gradient text-white font-headline font-bold rounded-full shadow-lg shadow-primary/25 active:scale-[0.97] transition-all mt-4" type="submit">
                    Entrar
                </button>
</form>
<!-- Bottom Action -->
<div class="mt-10 text-center">
<p class="text-sm font-medium text-on-surface-variant">
                    Não tem uma conta? 
                    <a class="text-secondary font-bold hover:underline ml-1" href="#">Cadastre-se</a>
</p>
</div><!-- Divider -->
<div class="relative my-8 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant opacity-30"></div>
</div>
<span class="relative bg-surface-container-lowest px-4 text-[10px] font-bold uppercase tracking-widest text-outline">ou entre com</span>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-3">
<button class="flex items-center justify-center gap-3 h-14 rounded-full border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.98] transition-all px-6 text-sm font-semibold text-on-surface">

<span>Continuar com Google</span>
</button>
<button class="flex items-center justify-center gap-3 h-14 rounded-full border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.98] transition-all px-6 text-sm font-semibold text-on-surface">
<span class="material-symbols-outlined text-[24px]">apple</span>
<span>Continuar com Apple</span>
</button>
</div>
</main>
<!-- System Links -->
<footer class="pb-10 px-6">
<div class="flex justify-center gap-8 text-[10px] font-bold uppercase tracking-widest text-outline">
<a class="hover:text-on-surface" href="#">Privacidade</a>
<a class="hover:text-on-surface" href="#">Termos</a>
<a class="hover:text-on-surface" href="#">Ajuda</a>
</div>
</footer>
</div>
