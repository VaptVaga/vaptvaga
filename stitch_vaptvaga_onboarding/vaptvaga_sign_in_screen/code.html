<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VaptVaga - Crie sua conta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary": "#006c49",
              "secondary-container": "#6cf8bb",
              "background": "#f9f9ff",
              "outline": "#737686",
              "surface-container-highest": "#d8e3fb",
              "on-background": "#111c2d",
              "error": "#ba1a1a",
              "surface-variant": "#d8e3fb",
              "on-surface-variant": "#434655",
              "on-primary-container": "#eeefff",
              "surface-bright": "#f9f9ff",
              "surface-container-high": "#dee8ff",
              "on-tertiary-fixed-variant": "#7d2d00",
              "secondary-fixed": "#6ffbbe",
              "on-error-container": "#93000a",
              "primary-container": "#2563eb",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "on-secondary-container": "#00714d",
              "surface-tint": "#0053db",
              "inverse-primary": "#b4c5ff",
              "primary": "#004ac6",
              "surface-container": "#e7eeff",
              "on-primary": "#ffffff",
              "on-surface": "#111c2d",
              "on-secondary-fixed": "#002113",
              "surface-container-low": "#f0f3ff",
              "inverse-surface": "#263143",
              "on-primary-fixed-variant": "#003ea8",
              "surface-container-lowest": "#ffffff",
              "on-secondary": "#ffffff",
              "on-primary-fixed": "#00174b",
              "tertiary-fixed-dim": "#ffb596",
              "on-secondary-fixed-variant": "#005236",
              "primary-fixed-dim": "#b4c5ff",
              "inverse-on-surface": "#ecf1ff",
              "tertiary-container": "#bc4800",
              "primary-fixed": "#dbe1ff",
              "surface": "#f9f9ff",
              "on-tertiary-container": "#ffede6",
              "tertiary-fixed": "#ffdbcd",
              "surface-dim": "#cfdaf2",
              "secondary-fixed-dim": "#4edea3",
              "outline-variant": "#c3c6d7",
              "on-tertiary-fixed": "#360f00",
              "on-tertiary": "#ffffff",
              "tertiary": "#943700"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9ff;
        }
        h1, h2, h3, .brand-font {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-6">
<!-- Auth Container -->
<main class="w-full max-w-[520px] bg-surface-container-lowest rounded-xl p-8 md:p-12 shadow-[0px_24px_48px_rgba(17,28,45,0.06)] relative overflow-hidden">
<!-- Header Section -->
<header class="text-center mb-10">
<div class="inline-flex items-center justify-center mb-4">
<span class="brand-font text-3xl font-black text-primary tracking-tighter">VaptVaga</span>
</div>
<h1 class="headline-md text-2xl font-bold tracking-tight text-on-surface mb-2">Crie sua conta</h1>
<p class="text-on-surface-variant text-sm">Escolha seu perfil e comece agora.</p>
</header>
<!-- Profile Selection (Asymmetric Bento-ish Style) -->
<div class="grid grid-cols-2 gap-4 mb-8">
<!-- Company Option -->
<button class="flex flex-col items-start p-6 bg-surface-container-low rounded-lg border-2 border-transparent hover:border-primary/20 focus:border-primary transition-all text-left group">
<div class="w-12 h-12 rounded-full bg-white flex items-center justify-center mb-4 shadow-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary" data-icon="business">business</span>
</div>
<span class="font-bold text-on-surface text-sm">Sou Empresa</span>
<span class="text-[10px] text-on-surface-variant mt-1 leading-tight">Busco talentos para projetos</span>
</button>
<!-- Freelancer Option -->
<button class="flex flex-col items-start p-6 bg-surface-container-low rounded-lg border-2 border-primary focus:border-primary transition-all text-left group">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center mb-4 shadow-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-white" data-icon="person_search" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person_search</span>
</div>
<span class="font-bold text-on-surface text-sm">Sou Freelancer</span>
<span class="text-[10px] text-on-surface-variant mt-1 leading-tight">Busco novas oportunidades</span>
</button>
</div>
<!-- Registration Form -->
<form action="#" class="space-y-5">
<div class="space-y-1.5">
<label class="label-md font-bold text-on-surface ml-1" for="full_name">Nome Completo</label>
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all text-on-surface placeholder:text-outline/50" id="full_name" placeholder="Ex: João Silva" type="text"/>
</div>
<div class="space-y-1.5">
<label class="label-md font-bold text-on-surface ml-1" for="email">E-mail</label>
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all text-on-surface placeholder:text-outline/50" id="email" placeholder="seu@email.com" type="email"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="label-md font-bold text-on-surface ml-1" for="password">Senha</label>
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all text-on-surface placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-1.5">
<label class="label-md font-bold text-on-surface ml-1" for="confirm_password">Confirmar Senha</label>
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all text-on-surface placeholder:text-outline/50" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full h-14 mt-4 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-xl shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                Criar Minha Conta
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest font-bold text-outline">
<span class="bg-surface-container-lowest px-4">Ou registre-se com</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<button class="h-12 flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container-high rounded-full transition-colors font-semibold text-on-surface text-sm px-6">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google colorful brand logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDt3mClctl4je9_CK_UcM70BAT_VFmTFaHg0LyJU2_D7pEhviMbetBGnrU1GIpSHb7LPJa2Zyb1Xz5p25VsMz1sHwtMztgyIImeFal1duSFiknQGwILVsvKPydKeLeQ_6XvlbuffA943Wxry8sRsDCtPzZkBkDr-eQctDzH-BTRWjOf-QoWkTqlvsQIcUAoKMOHpVNGc_gmu_MhyyAN4vvxoBuXFpoaYrrM3FtLsPF5D8M_X2F3wCfL9zUR8z-pbUoVbfLl4BNmN3U"/>
                Continuar com Google
            </button>
<button class="h-12 flex items-center justify-center gap-3 bg-on-surface text-white hover:opacity-90 rounded-full transition-colors font-semibold text-sm px-6">
<span class="material-symbols-outlined text-lg" data-icon="apple" data-weight="fill" style="font-variation-settings: 'FILL' 1;">ios</span>
                Continuar com Apple
            </button>
</div>
<!-- Footer Link -->
<footer class="mt-12 text-center">
<p class="text-on-surface-variant text-sm font-medium">
                Já tem uma conta? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Entrar</a>
</p>
</footer>
<!-- Decorative Elements -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>
<div class="absolute bottom-0 left-0 w-32 h-32 bg-secondary/5 rounded-full -ml-16 -mb-16 blur-3xl"></div>
</main>
</body></html>
