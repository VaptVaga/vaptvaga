<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#6cf8bb",
              "primary": "#004ac6",
              "on-secondary-fixed-variant": "#005236",
              "on-secondary": "#ffffff",
              "secondary": "#006c49",
              "inverse-primary": "#b4c5ff",
              "surface-tint": "#0053db",
              "on-surface-variant": "#434655",
              "error": "#ba1a1a",
              "surface-container-highest": "#d8e3fb",
              "on-tertiary-container": "#ffede6",
              "on-tertiary-fixed-variant": "#7d2d00",
              "secondary-fixed": "#6ffbbe",
              "surface": "#f9f9ff",
              "tertiary-fixed-dim": "#ffb596",
              "inverse-surface": "#263143",
              "primary-container": "#2563eb",
              "on-tertiary-fixed": "#360f00",
              "on-primary-container": "#eeefff",
              "on-primary-fixed": "#00174b",
              "tertiary-container": "#bc4800",
              "on-error-container": "#93000a",
              "background": "#f9f9ff",
              "on-primary-fixed-variant": "#003ea8",
              "on-secondary-fixed": "#002113",
              "outline": "#737686",
              "surface-container-high": "#dee8ff",
              "error-container": "#ffdad6",
              "tertiary": "#943700",
              "surface-container": "#e7eeff",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#dbe1ff",
              "on-surface": "#111c2d",
              "surface-variant": "#d8e3fb",
              "surface-bright": "#f9f9ff",
              "surface-dim": "#cfdaf2",
              "on-primary": "#ffffff",
              "on-background": "#111c2d",
              "tertiary-fixed": "#ffdbcd",
              "secondary-fixed-dim": "#4edea3",
              "on-tertiary": "#ffffff",
              "primary-fixed-dim": "#b4c5ff",
              "outline-variant": "#c3c6d7",
              "inverse-on-surface": "#ecf1ff",
              "surface-container-low": "#f0f3ff",
              "on-secondary-container": "#00714d",
              "on-error": "#ffffff"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      ::-webkit-scrollbar { display: none; }
      body { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-secondary-container/30">
<!-- Top Navigation Anchor -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 w-full">
<button aria-label="Voltar" class="w-10 h-10 flex items-center justify-start tap-highlight-none active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-plus-jakarta text-headline-md font-bold tracking-tight text-on-surface">VaptVaga</h1>
<div class="w-10 h-10 flex items-center justify-end">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-md mx-auto min-h-screen">
<!-- Progress Indicator Section -->
<section class="mb-10">
<div class="flex justify-between items-end mb-4">
<div>
<span class="text-label-md font-bold uppercase tracking-wider text-primary mb-1 block">Passo 1 de 3</span>
<h2 class="font-headline text-headline-md font-extrabold text-on-surface leading-tight">Detalhes da Vaga</h2>
</div>
<div class="flex gap-1.5 mb-2">
<div class="w-8 h-1.5 rounded-full bg-primary"></div>
<div class="w-8 h-1.5 rounded-full bg-surface-container-highest"></div>
<div class="w-8 h-1.5 rounded-full bg-surface-container-highest"></div>
</div>
</div>
<p class="text-body-lg text-on-surface-variant">Comece definindo o que você precisa. Seja claro para atrair os melhores candidatos.</p>
</section>
<!-- Form Layout -->
<form class="space-y-8">
<!-- Title Field -->
<div class="space-y-3">
<label class="text-label-md font-bold uppercase tracking-wider text-on-surface-variant ml-2">Título do Anúncio</label>
<div class="relative group">
<input class="w-full h-16 px-6 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-300" placeholder="Ex: Dog Walker para Golden Retriever" type="text"/>
</div>
</div>
<!-- Category Field (Horizontal Bento Selection) -->
<div class="space-y-3">
<label class="text-label-md font-bold uppercase tracking-wider text-on-surface-variant ml-2">Categoria</label>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-start p-5 bg-surface-container-lowest border-2 border-primary rounded-xl transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-primary mb-3" style="font-variation-settings: 'FILL' 1;">pets</span>
<span class="font-bold text-on-surface">Pets</span>
</button>
<button class="flex flex-col items-start p-5 bg-surface-container-low border-2 border-transparent rounded-xl hover:bg-surface-container-lowest transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-on-surface-variant mb-3">cleaning_services</span>
<span class="font-bold text-on-surface">Limpeza</span>
</button>
<button class="flex flex-col items-start p-5 bg-surface-container-low border-2 border-transparent rounded-xl hover:bg-surface-container-lowest transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-on-surface-variant mb-3">home_repair_service</span>
<span class="font-bold text-on-surface">Reparos</span>
</button>
<button class="flex flex-col items-start p-5 bg-surface-container-low border-2 border-transparent rounded-xl hover:bg-surface-container-lowest transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-on-surface-variant mb-3">more_horiz</span>
<span class="font-bold text-on-surface">Outros</span>
</button>
</div>
</div>
<!-- Description Field -->
<div class="space-y-3">
<label class="text-label-md font-bold uppercase tracking-wider text-on-surface-variant ml-2">Descrição das tarefas</label>
<textarea class="w-full p-6 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-300" placeholder="Descreva o que o profissional irá fazer..." rows="5"></textarea>
</div>
<!-- Location Group (Editorial Grid) -->
<div class="grid grid-cols-3 gap-3">
<div class="col-span-1 space-y-3">
<label class="text-label-md font-bold uppercase tracking-wider text-on-surface-variant ml-2">Estado</label>
<div class="relative">
<select class="w-full h-16 pl-6 pr-10 bg-surface-container-low border-none rounded-xl text-on-surface appearance-none focus:ring-2 focus:ring-primary/20 transition-all">
<option>SP</option>
<option>RJ</option>
<option>MG</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<div class="col-span-2 space-y-3">
<label class="text-label-md font-bold uppercase tracking-wider text-on-surface-variant ml-2">Cidade</label>
<input class="w-full h-16 px-6 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-300" placeholder="Ex: São Paulo" type="text"/>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Bar -->
<footer class="fixed bottom-0 w-full z-50 bg-white/80 backdrop-blur-2xl px-6 pb-8 pt-4 rounded-t-[3rem] shadow-[0px_-8px_24px_rgba(17,28,45,0.04)]">
<div class="max-w-md mx-auto">
<button class="w-full h-16 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg rounded-full shadow-lg shadow-primary/20 active:scale-95 transition-transform duration-200 flex items-center justify-center gap-2">
                Continuar
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
